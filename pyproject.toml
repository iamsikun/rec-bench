[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=2.3.4"]
build-backend = "setuptools.build_meta"


[project]
name = "rec-benchmark"
version = "0.1.0"
description = "A standardized benchmark for recommendation algorithms: pinned benchmarks, downloadable datasets, one Recommender interface."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sikun Xu", email = "xusikun96@gmail.com" },
]
keywords = ["recommender-systems", "benchmark", "ctr", "sequential-recommendation", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "huggingface-hub>=0.24",
    "numpy>=2.3.4",
    "polars>=1.37.1",
    "scipy>=1.14",
    "torch>=2.6",
]

[project.urls]
Homepage = "https://github.com/iamsikun/rec-bench"
Repository = "https://github.com/iamsikun/rec-bench"
Issues = "https://github.com/iamsikun/rec-bench/issues"

# define the CUDA-specific index
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # Crucial: prevents uv from searching this index for other packages

# tell uv to use that index only on windows
[tool.uv.sources]
torch = [
    {index = "pytorch-cu130", marker = "sys_platform == 'win32'"}
]


[project.scripts]
recsys = "recsys.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "scikit-learn>=1.5",
    "vulture>=2.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not reference and not perf' -n auto --dist worksteal"
markers = [
    "network: downloads real datasets (run with -m network)",
    "reference: reproduces published numbers on full datasets (slow; -m reference)",
    "perf: wall-clock and memory bounds on real datasets (-m perf)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
