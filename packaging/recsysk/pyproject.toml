[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Final release of the old PyPI name. It ships no code; installing it pulls in
# rec-benchmark, which provides the same `recsys` package and CLI.
[project]
name = "recsysk"
version = "0.2.0"
description = "Renamed to rec-benchmark. Install rec-benchmark instead."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sikun Xu", email = "xusikun96@gmail.com" },
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]
dependencies = ["rec-benchmark>=0.1.0"]

[project.urls]
Homepage = "https://github.com/iamsikun/rec-bench"
Repository = "https://github.com/iamsikun/rec-bench"

[tool.setuptools]
packages = []
