# Published numbers reproduced by tests/test_reference.py (pytest -m reference).
# Every target was copied from the cited table; see docs/acceptance.md (criterion D2).

[[reference]]
algo = "ease"
benchmark = "ml-20m-strong"
params = { reg = 500.0 }
targets = { "nrecall@20" = 0.391, "nrecall@50" = 0.521, "ndcg@100" = 0.420 }
abs = 0.005
source = "Steck, Embarrassingly Shallow Autoencoders, WWW 2019, Table 1"

